<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آراء وتقييمات الطلاب | المهندس أحمد بهنسي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-green: #1B3B2B;
            --card-cream: #F5F2E9;
            --accent-gold: #D4A359;
            --text-dark: #1E1E1E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        html, body {
            height: 100%;
            background-color: var(--bg-green);
            color: var(--card-cream);
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 20px 20px 0 20px; /* إزالة البادينج السفلي */
        }

        header {
            text-align: center;
            padding: 20px 15px 15px;
            color: var(--card-cream);
        }

        header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        header p {
            color: var(--accent-gold);
            font-size: 1.15rem;
            font-weight: 600;
        }

        .instructor-tag {
            background: rgba(255, 255, 255, 0.08);
            display: inline-block;
            padding: 8px 22px;
            border-radius: 20px;
            margin-top: 15px;
            border: 1px solid var(--accent-gold);
            color: var(--card-cream);
            font-size: 0.95rem;
        }

        .gallery-container {
            max-width: 1350px;
            margin: 25px auto 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1; /* يدفع الفوتر للقاع بدون مسافات زائفة */
        }

        .row-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            align-items: stretch;
        }

        .img-card {
            background: var(--card-cream);
            border-radius: 16px;
            padding: 0;
            border: 2px solid transparent;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
        }

        .img-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 12px 26px rgba(0,0,0,0.4);
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 950px) {
            .row-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 550px) {
            .row-grid { grid-template-columns: repeat(1, 1fr); }
        }

        /* Lightbox Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-img {
            max-width: 92%;
            max-height: 88vh;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(212, 163, 89, 0.5);
            border: 2px solid var(--accent-gold);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            left: 30px;
            color: var(--card-cream);
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--accent-gold);
        }

        /* الفوتر بدون مسافة سفيلة زائدة */
        footer {
            text-align: center;
            color: var(--card-cream);
            margin-top: auto;
            padding: 20px;
            font-size: 0.95rem;
            border-top: 1px solid rgba(212, 163, 89, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--bg-green);
        }

        footer span.gear { color: var(--accent-gold); font-size: 1.1rem; }
        footer span.highlight { color: var(--accent-gold); font-weight: 700; }
    </style>
</head>

    <script>
        function openModal(element) {
            const modal = document.getElementById('imageModal');
            const fullImg = document.getElementById('fullImage');
            const imgSrc = element.querySelector('img').src;
            fullImg.src = imgSrc;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
